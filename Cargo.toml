[workspace]
members = ["cadical-veripb-tracer", "core", "hitting-sets", "proc"]
exclude = ["rustsat", "maxpre-rs"]
resolver = "2"

[workspace.package]
edition = "2024"
authors = ["Christoph Jabs <christoph.jabs@helsinki.fi>"]
license = "MIT"
version = "0.4.0"

[workspace.dependencies]
anyhow = "1.0.98"
cadical-veripb-tracer = { version = "0.1.0", path = "./cadical-veripb-tracer" }
cfg-if = "1.0.1"
clap = { version = "4.5.40", features = ["derive", "cargo", "color"] }
clap-verbosity-flag = { version = "3.0.3", default-features = false, features = [
  "tracing",
] }
cpu-time = "1.0.0"
fastrand = "2.3.0"
git-version = "0.3.9"
grb = "3.0.1"
highs = "2.0.0"
hitting-sets = { path = "./hitting-sets" }
itertools = "0.14.0"
libtest-mimic = "0.8.1"
maxpre = { version = "0.2.5", features = ["multiopt"] }
owo-colors = "4.2.2"
pigeons = "0.2.0"
rustsat = { version = "0.7.2", features = [
  "multiopt",
  "internals",
  "proof-logging",
] }
rustsat-cadical = { version = "0.7.2", features = ["v2-1-3", "pigeons"] }
signal-hook = "0.3.18"
scuttle-core = { version = "0.4.0", path = "./core" }
scuttle-proc = { version = "0.4.0", path = "./proc" }
tempfile = "3.20.0"
thiserror = "2.0.12"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"

[package]
name = "scuttle"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A multi-objective MaxSAT solver."
keywords = ["solver", "multi-objective", "maxsat"]
repository = "https://github.com/chrjabs/scuttle"
readme = "README.md"

[dependencies]
anyhow.workspace = true
cpu-time.workspace = true
clap.workspace = true
clap-verbosity-flag.workspace = true
git-version.workspace = true
hitting-sets.workspace = true
maxpre = { workspace = true, optional = true }
pigeons.workspace = true
rustsat.workspace = true
rustsat-cadical.workspace = true
scuttle-core = { workspace = true, features = ["clap"] }
signal-hook.workspace = true
owo-colors.workspace = true
thiserror.workspace = true
tracing = { workspace = true, features = ["release_max_level_debug"] }
tracing-subscriber.workspace = true

[features]
default = ["gurobi12"]
sol-tightening = ["scuttle-core/sol-tightening"]
maxpre = ["dep:maxpre", "scuttle-core/maxpre"]
gurobi9 = ["scuttle-core/gurobi9"]
gurobi12 = ["scuttle-core/gurobi12"]

[profile.release]
lto = true

[profile.profiling]
inherits = "release"
debug = 1

[patch.crates-io]
grb = { git = "https://github.com/chrjabs/rust-grb.git", branch = "scuttle" }
highs = { git = "https://github.com/chrjabs/highs.git", branch = "scuttle" }
rustsat = { git = "https://github.com/chrjabs/rustsat.git", branch = "scuttle" }
rustsat-cadical = { git = "https://github.com/chrjabs/rustsat.git", branch = "scuttle" }
pigeons = { git = "https://github.com/chrjabs/rustsat.git", branch = "scuttle" }
